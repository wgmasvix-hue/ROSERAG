services:
  # ── Vector database ─────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: roserag-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  # ── Redis cache ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: roserag-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  # Ollama runs natively on the host (already on port 11434).
  # host-gateway lets the container reach it as host.docker.internal.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: roserag-backend
    ports:
      - "127.0.0.1:8002:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379
      - LLM_API_BASE=http://host.docker.internal:11434
      - LLM_API_KEY=
      - CHAT_MODEL=qwen2.5:3b
      - REASONER_MODEL=qwen2.5:3b
      - EMBED_API_BASE=http://host.docker.internal:11434
      - EMBED_API_KEY=
      - EMBED_MODEL=nomic-embed-text
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── RASA dialogue server ─────────────────────────────────────────────────
  rasa:
    build:
      context: ./rasa
      dockerfile: Dockerfile
    container_name: roserag-rasa
    ports:
      - "127.0.0.1:5005:5005"
    volumes:
      - rasa_models:/app/models
    depends_on:
      - rasa-actions
      - backend
    environment:
      - RASA_TELEMETRY_ENABLED=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── RASA action server ────────────────────────────────────────────────────
  rasa-actions:
    build:
      context: ./rasa
      dockerfile: Dockerfile.actions
    container_name: roserag-rasa-actions
    ports:
      - "127.0.0.1:5055:5055"
    environment:
      - ROSERAG_API_URL=http://backend:8000
      - DSPACE_URL=https://bulawayopolytecnicrepository.dare.co.zw
      - ROSERAG_API_TIMEOUT=30
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  qdrant_data:
  redis_data:
  rasa_models:
