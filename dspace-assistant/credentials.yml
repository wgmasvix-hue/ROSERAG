# Credentials for various channels

# REST channel (default)
rest:

# WebSocket channel (optional)
# websocket:
#   user_message_evt: user_uttered
#   bot_message_evt: bot_uttered

# Slack (optional)
# slack:
#   slack_channel: "#dspace-bot"
#   slack_token: ${SLACK_BOT_TOKEN}

# Microsoft Teams (optional)
# msteams:
#   app_id: ${MS_APP_ID}
#   app_password: ${MS_APP_PASSWORD}

# Telegram (optional)
# telegram:
#   access_token: ${TELEGRAM_TOKEN}
#   verify: "YOUR_BOT_NAME"
#   webhook_url: "https://yourdomain.com/webhooks/telegram/webhook"

# Discord (optional)
# discord:
#   token: ${DISCORD_TOKEN}

# Custom REST channel configuration
rest:
  # Set to 'websocket' for long-lived connections
  stream_handler:
    type: aiohttp
    port: 5005
