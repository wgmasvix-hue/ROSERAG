<!--
  ════════════════════════════════════════════════════════════════
  ChengetAI Labs — DSpace Community Embed Snippet
  ════════════════════════════════════════════════════════════════

  HOW TO USE
  ──────────
  1. In your DSpace instance, go to:
       Edit Community → Introductory Text  (or News / Sidebar text)
  2. Switch the editor to HTML / Source mode
  3. Paste the <div> block below (everything between the ─── markers)
  4. Save the community

  The widget opens a new tab for search results — users stay in DSpace.

  PREREQUISITES
  ─────────────
  • Your RoseRAG platform must be deployed at https://roserag.dare.co.zw
  • CORS is not required — iframe + target="_blank" avoid CORS entirely
  • DSpace must allow <iframe> in community intro text
    (In DSpace 8.x: Administration → Settings → UI Security → allow iframe src)

  TROUBLESHOOTING
  ───────────────
  • If the iframe is blocked by DSpace's Content Security Policy, use the
    "Link-only" fallback block at the bottom of this file instead.
  • Adjust height="460" to fit your community page layout.
  ════════════════════════════════════════════════════════════════
-->

<!-- ─── PASTE THIS BLOCK INTO DSPACE COMMUNITY INTRO TEXT ─────────────────── -->
<div style="margin:0 0 24px;font-family:sans-serif">
  <iframe
    src="https://roserag.dare.co.zw/embed"
    width="100%"
    height="460"
    frameborder="0"
    allow="clipboard-write"
    loading="lazy"
    title="ChengetAI Labs — AI Research Search"
    style="border-radius:12px;border:1px solid #9b2248;display:block;max-width:760px"
  ></iframe>
  <p style="margin:8px 0 0;font-size:12px;color:#666;text-align:center">
    Powered by
    <a href="https://roserag.dare.co.zw" target="_blank" rel="noopener noreferrer"
       style="color:#9b2248;font-weight:600;text-decoration:none">
      ChengetAI Labs
    </a>
    — AI intelligence layer for this DARE repository
  </p>
</div>
<!-- ─── END PASTE BLOCK ────────────────────────────────────────────────────── -->
